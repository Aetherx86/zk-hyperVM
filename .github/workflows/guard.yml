name: Repository Guard

on:
  push:
    tags:
      - "v*.0.0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: Supply Chain Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 .github/scripts/repo_guard.py .
