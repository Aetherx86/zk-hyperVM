name: Continuous Integration

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  format:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check code formatting (cargo fmt)
        run: cargo fmt -- --check

  clippy:
    name: Clippy Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2

      - name: Run clippy with strict warnings
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test Suite Matrix (${{ matrix.os }} / ${{ matrix.rust }})
    needs: [format, clippy]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --all-targets

      - name: Run unit and integration tests (release)
        run: cargo test --release --all-targets -- --nocapture

      - name: Validate CLI Execution (run command)
        run: cargo run --release -- run --iterations 20

      - name: Validate CLI Prover and Decider (prove command)
        run: cargo run --release -- prove --iterations 10

      - name: Validate Benchmark Output (bench command)
        run: cargo run --release -- bench
