name: CI Safety & Quality Pipeline

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ===========================================================================
  # 1. Security & Safety: Secret Scanning and Repository Hygiene
  # ===========================================================================
  security-audit:
    name: Security & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Repository Hygiene & Conflict Marker Verification
        run: |
          echo "Scanning for unresolved git conflict markers..."
          ! git grep -I -nE '^<{7} |^={7}$|^>{7} ' || (echo "Error: Unresolved conflict markers found" && exit 1)
          echo "Repository hygiene check completed successfully."

  # ===========================================================================
  # 2. Rust Quality, Tests & Matrix Execution
  # ===========================================================================
  rust-workflow:
    name: Rust Quality & Test Matrix (${{ matrix.os }})
    needs: [security-audit]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Rust Formatting Check (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Rust Linter Check (cargo clippy)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build Release Binaries
        run: cargo build --release --all-targets

      - name: Run Unit and Integration Tests (cargo test)
        run: cargo test --release --all-targets --all-features -- --nocapture

      - name: Validate CLI Execution (run command)
        run: cargo run --release -- run --iterations 20

      - name: Validate CLI Prover and Decider (prove command)
        run: cargo run --release -- prove --iterations 10

      - name: Validate Benchmark Output (bench command)
        run: cargo run --release -- bench

  # ===========================================================================
  # 3. Go Control-Plane & Network Matrix Execution
  # ===========================================================================
  go-workflow:
    name: Go Control-Plane Matrix (${{ matrix.os }})
    needs: [security-audit]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for Go modules
        id: check_go
        run: |
          if [ -n "$(find . -name 'go.mod' -maxdepth 3)" ]; then
            echo "go_present=true" >> $GITHUB_OUTPUT
          else
            echo "go_present=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Go
        if: steps.check_go.outputs.go_present == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Test and Vet Go modules
        if: steps.check_go.outputs.go_present == 'true'
        run: |
          for mod in $(find . -name "go.mod" -maxdepth 3 -exec dirname {} \;); do
            echo "Processing Go module in $mod..."
            (cd "$mod" && go vet ./... && go test -v -race ./... && go build ./...)
          done

  # ===========================================================================
  # 4. TypeScript DSL & CLI Quality Matrix Execution
  # ===========================================================================
  ts-workflow:
    name: TypeScript DSL & CLI Matrix (${{ matrix.os }})
    needs: [security-audit]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for TypeScript / Node packages
        id: check_ts
        run: |
          if [ -n "$(find . -name 'package.json' -not -path '*/node_modules/*' -maxdepth 3)" ]; then
            echo "ts_present=true" >> $GITHUB_OUTPUT
          else
            echo "ts_present=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        if: steps.check_ts.outputs.ts_present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies, build and test TypeScript packages
        if: steps.check_ts.outputs.ts_present == 'true'
        run: |
          for pkg in $(find . -name "package.json" -not -path '*/node_modules/*' -maxdepth 3 -exec dirname {} \;); do
            echo "Processing Node package in $pkg..."
            (cd "$pkg" && (npm ci || npm install) && (npm run build --if-present) && (npm test --if-present))
          done
