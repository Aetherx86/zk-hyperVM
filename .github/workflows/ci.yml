name: CI Safety & Quality Pipeline

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ===========================================================================
  # 1. Security & Safety: Secret Scanning and Repository Hygiene
  # ===========================================================================
  security-audit:
    name: Security & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Repository Hygiene & Conflict Marker Verification
        run: |
          echo "Scanning for unresolved git conflict markers..."
          ! git grep -I -nE '^<{7} |^={7}$|^>{7} ' || (echo "Error: Unresolved conflict markers found" && exit 1)
          echo "Repository hygiene check completed successfully."

  # ===========================================================================
  # 2. Rust Quality, Tests & Security Workflow Matrix
  # ===========================================================================
  rust-workflow:
    name: Rust Quality & Test Matrix (${{ matrix.os }})
    needs: [security-audit]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Rust Formatting Check (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Rust Linter Check (cargo clippy)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build Release Binaries
        run: cargo build --release --all-targets

      - name: Run Unit and Integration Tests (cargo test)
        run: cargo test --release --all-targets --all-features -- --nocapture

      - name: Rust Vulnerability Audit (cargo audit)
        run: cargo audit

      - name: Strict Documentation Build (cargo doc)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features

      - name: Validate CLI Execution (run command)
        run: cargo run --release -- run --iterations 20

      - name: Validate CLI Prover and Decider (prove command)
        run: cargo run --release -- prove --iterations 10

      - name: Validate Benchmark Output (bench command)
        run: cargo run --release -- bench

  # ===========================================================================
  # 3. Docker Quality & Vulnerability Workflow (Conditional)
  # ===========================================================================
  docker-workflow:
    name: Docker Lint, Build & Trivy Scan
    runs-on: ubuntu-latest
    if: hashFiles('**/Dockerfile*') != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          ignore: DL3008,DL3013
          failure-threshold: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          if [ -f "Dockerfile" ]; then
            docker build -t ci-test-image:latest -f Dockerfile .
          else
            FIRST_DF=$(find . -name "Dockerfile*" -not -path "*/node_modules/*" | head -n 1)
            CONTEXT_DIR=$(dirname "$FIRST_DF")
            docker build -t ci-test-image:latest -f "$FIRST_DF" "$CONTEXT_DIR"
          fi

      - name: Container Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ci-test-image:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
