name: Security Audit

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: "0 0 * * 1" # Weekly every Monday at 00:00 UTC
  workflow_dispatch:

jobs:
  rust-audit:
    name: Rust Security Advisory Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install and Run cargo-audit
        run: |
          cargo install cargo-audit --locked || true
          cargo audit

  go-audit:
    name: Go Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for Go modules
        id: check_go
        run: |
          if [ -n "$(find . -name 'go.mod' -maxdepth 3)" ]; then
            echo "go_present=true" >> $GITHUB_OUTPUT
          else
            echo "go_present=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Go
        if: steps.check_go.outputs.go_present == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run govulncheck
        if: steps.check_go.outputs.go_present == 'true'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          for mod in $(find . -name "go.mod" -maxdepth 3 -exec dirname {} \;); do
            echo "Auditing Go module in $mod..."
            (cd "$mod" && govulncheck ./...)
          done

  ts-audit:
    name: TypeScript / Node Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for TypeScript / Node packages
        id: check_ts
        run: |
          if [ -n "$(find . -name 'package.json' -not -path '*/node_modules/*' -maxdepth 3)" ]; then
            echo "ts_present=true" >> $GITHUB_OUTPUT
          else
            echo "ts_present=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        if: steps.check_ts.outputs.ts_present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run npm audit
        if: steps.check_ts.outputs.ts_present == 'true'
        run: |
          for pkg in $(find . -name "package.json" -not -path '*/node_modules/*' -maxdepth 3 -exec dirname {} \;); do
            echo "Auditing Node package in $pkg..."
            (cd "$pkg" && npm audit --audit-level=high)
          done
