name: Benchmark & Constraint Verification

on:
  push:
    tags:
      - "v*.0.0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Verify Constraint Reductions (Paper Table IV)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run concrete constraint reduction benchmarks
        run: cargo run --release -- bench
